<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Математикалық ойын</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(120deg, #d0eaff, #99caff 70%);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(90,130,255,0.10);
      padding: 40px 30px 30px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #357da3;
    }
    select, input[type=number] {
      font-size: 1.1rem;
      border: 2px solid #99caff;
      border-radius: 8px;
      padding: 7px;
      margin-bottom: 10px;
      width: 85%;
      outline: none;
    }
    button {
      background: #99caff;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 25px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background .2s;
      margin-bottom: 18px;
    }
    button:hover {
      background: #357da3;
    }
    #result {
      font-size: 1.1rem;
      margin: 16px 0 8px;
      color: #333;
      min-height: 24px;
    }
    #reset {
      display: none;
      margin-top: 10px;
    }
    .task {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 16px 0 8px;
      color: #244d68;
    }
    .timer {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #e86e4a;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .score-block {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }
    .score {
      color: #357da3;
      font-weight: bold;
    }
    .records-table {
      background: #f6faff;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(90,130,255,0.03);
      margin: 16px 0 10px 0;
      padding: 10px 7px;
      text-align: left;
    }
    .records-table h3 {
      font-size: 1rem;
      margin: 0 0 7px 0;
      color: #357da3;
    }
    .records-table ul {
      margin: 0;
      padding: 0 0 0 20px;
    }
    .records-table li {
      font-size: 0.98rem;
      margin-bottom: 2px;
      color: #384e5d;
    }
    .music-btn {
      margin-top: 5px;
      background: #ffd700;
      color: #244d68;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1.02rem;
      padding: 7px 14px;
      transition: background 0.15s;
    }
    .music-btn.active {
      background: #ffe97c;
      color: #356d23;
    }
    .music-label {
      margin-bottom: 7px;
      color: #244d68;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Математикалық ойын</h1>
    <div class="score-block">
      <span>Ұпай: <span class="score" id="score">0</span></span>
      <span>Рекорд: <span class="score" id="highscore">0</span></span>
    </div>
    <label>Сынып таңдаңыз:</label><br>
    <select id="level" onchange="changeLevel()">
      <option value="1">1 сынып (жеңіл мысалдар)</option>
      <option value="2">2 сынып (қиынырақ)</option>
      <option value="3">3 сынып (100-ге дейін)</option>
      <option value="4">4 сынып (500-ге дейін)</option>
      <option value="5">5 сынып (көбейту, бөлу)</option>
    </select>
    <div class="timer" id="timer"></div>
    <div class="task" id="task"></div>
    <input type="number" id="answer" placeholder="Жауабыңыз">
    <br>
    <button onclick="checkAnswer()" id="checkBtn">Тексеру</button>
    <p id="result"></p>
    <button id="reset" onclick="startGame()">Келесі мысал</button>
    <div class="music-label">Домбыра әуені:</div>
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">Включить</button>
    <div class="records-table">
      <h3>Рекордтар кестесі</h3>
      <ul id="recordsList"></ul>
    </div>
  </div>
  <!-- Звуки -->
  <audio id="right" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12e1b4baf5.mp3"></audio>
  <audio id="wrong" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12c03e10d3.mp3"></audio>
  <!-- Домбыра “Детство” (Asylbek Ensepov) -->
  <audio id="dombra" src="https://assets.codebuckets.com/asylbek-ensepov-detstvo.mp3" loop></audio>
  <script>
    let correctAnswer = 0;
    let timer = null;
    let timeLeft = 0;
    let score = 0;
    let highscore = 0;
    let currentLevel = 1;
    let timeLimits = [0, 20, 20, 25, 30, 35]; // 1-5 класс
    let musicPlaying = false;

    // Рекорды (по классам)
    let records = JSON.parse(localStorage.getItem('mathRecordsKZ') || '{}');
    if(!records) records = {};

    function updateRecordsTable() {
      let html = "";
      for(let i=1; i<=5; i++) {
        html += `<li>${i} сынып: ${records[i] || 0}</li>`;
      }
      document.getElementById('recordsList').innerHTML = html;
    }

    function playSound(type) {
      try {
        if(type === 'right') document.getElementById('right').play();
        else document.getElementById('wrong').play();
      } catch(e) {}
    }

    function randomInt(a, b) {
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }

    function changeLevel() {
      startGame();
      showHighscore();
    }

    function startGame() {
      document.getElementById('result').textContent = '';
      document.getElementById('answer').value = '';
      document.getElementById('reset').style.display = 'none';
      document.getElementById('answer').disabled = false;
      document.getElementById('checkBtn').disabled = false;
      currentLevel = +document.getElementById('level').value;
      let a, b, sign, taskText;

      if (timer) clearInterval(timer);

      if (currentLevel === 1) {
        a = randomInt(1, 10);
        b = randomInt(1, 10);
        correctAnswer = a + b;
        taskText = `${a} + ${b} = ?`;
      } else if (currentLevel === 2) {
        a = randomInt(5, 20);
        b = randomInt(1, 15);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else if (currentLevel === 3) {
        a = randomInt(10, 100);
        b = randomInt(10, 100);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else if (currentLevel === 4) {
        a = randomInt(100, 500);
        b = randomInt(10, 400);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else {
        const ops = ['+', '-', '×', '÷'];
        sign = ops[randomInt(0, 3)];
        if (sign === '+') {
          a = randomInt(20, 100);
          b = randomInt(10, 100);
          correctAnswer = a + b;
        } else if (sign === '-') {
          a = randomInt(20, 100);
          b = randomInt(10, a);
          correctAnswer = a - b;
        } else if (sign === '×') {
          a = randomInt(2, 15);
          b = randomInt(2, 15);
          correctAnswer = a * b;
        } else {
          b = randomInt(2, 15);
          correctAnswer = randomInt(2, 15);
          a = correctAnswer * b;
        }
        taskText = `${a} ${sign} ${b} = ?`;
      }
      document.getElementById('task').textContent = taskText;

      // Таймер
      timeLeft = timeLimits[currentLevel];
      document.getElementById('timer').textContent = `Қалған уақыт: ${timeLeft} сек`;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `Қалған уақыт: ${timeLeft} сек`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          document.getElementById('result').textContent = `⏰ Уақытың бітті! Дұрыс жауап: ${correctAnswer}`;
          document.getElementById('reset').style.display = 'inline-block';
          document.getElementById('answer').disabled = true;
          document.getElementById('checkBtn').disabled = true;
          playSound('wrong');
          updateScore(false);
        }
      }, 1000);
    }

    function updateScore(isRight) {
      if(isRight) {
        score++;
        if(score > (records[currentLevel] || 0)) {
          records[currentLevel] = score;
          localStorage.setItem('mathRecordsKZ', JSON.stringify(records));
          showHighscore();
        }
      } else {
        score = 0;
      }
      document.getElementById('score').textContent = score;
      updateRecordsTable();
    }

    function showHighscore() {
      let hs = records[currentLevel] || 0;
      document.getElementById('highscore').textContent = hs;
    }

    function checkAnswer() {
      if (timer) clearInterval(timer);
      const user = Number(document.getElementById('answer').value);
      if (user === correctAnswer) {
        document.getElementById('result').textContent = "Дұрыс! 👍";
        playSound('right');
        updateScore(true);
      } else {
        document.getElementById('result').textContent = `❌ Қате. Дұрыс жауап: ${correctAnswer}`;
        playSound('wrong');
        updateScore(false);
      }
      document.getElementById('reset').style.display = 'inline-block';
      document.getElementById('answer').disabled = true;
      document.getElementById('checkBtn').disabled = true;
    }

    // Музыка домбры
    function toggleMusic() {
      let dombyra = document.getElementById('dombra');
      let btn = document.getElementById('musicBtn');
      if(musicPlaying) {
        dombyra.pause();
        dombyra.currentTime = 0;
        btn.textContent = 'Включить';
        btn.classList.remove('active');
      } else {
        dombyra.play();
        btn.textContent = 'Выключить';
        btn.classList.add('active');
      }
      musicPlaying = !musicPlaying;
    }

    // Инициализация
    window.onload = () => {
      score = 0;
      updateScore(false);
      showHighscore();
      updateRecordsTable();
      startGame();
    }
  </script>
</body>
</html>
