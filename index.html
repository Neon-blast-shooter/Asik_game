<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Математическая игра</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(120deg, #d0eaff, #99caff 70%);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(90,130,255,0.10);
      padding: 40px 30px;
      max-width: 370px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #357da3;
    }
    select, input[type=number] {
      font-size: 1.1rem;
      border: 2px solid #99caff;
      border-radius: 8px;
      padding: 7px;
      margin-bottom: 10px;
      width: 85%;
      outline: none;
    }
    button {
      background: #99caff;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 25px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background .2s;
      margin-bottom: 18px;
    }
    button:hover {
      background: #357da3;
    }
    #result {
      font-size: 1.1rem;
      margin: 16px 0 8px;
      color: #333;
      min-height: 24px;
    }
    #reset {
      display: none;
      margin-top: 10px;
    }
    .task {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 16px 0 8px;
      color: #244d68;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Математическая игра</h1>
    <label>Выберите класс:</label><br>
    <select id="level" onchange="startGame()">
      <option value="1">1 класс (простые примеры)</option>
      <option value="2">2 класс (чуть сложнее)</option>
      <option value="3">3 класс (до 100)</option>
      <option value="4">4 класс (до 500)</option>
      <option value="5">5 класс (умножение, деление)</option>
    </select>
    <div class="task" id="task"></div>
    <input type="number" id="answer" placeholder="Ваш ответ">
    <br>
    <button onclick="checkAnswer()">Проверить</button>
    <p id="result"></p>
    <button id="reset" onclick="startGame()">Следующий пример</button>
  </div>
  <script>
    let correctAnswer = 0;

    function randomInt(a, b) {
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }

    function startGame() {
      document.getElementById('result').textContent = '';
      document.getElementById('answer').value = '';
      document.getElementById('reset').style.display = 'none';
      const level = +document.getElementById('level').value;
      let a, b, sign, taskText;

      if (level === 1) {
        // 1 класс: только сложение, числа до 10
        a = randomInt(1, 10);
        b = randomInt(1, 10);
        correctAnswer = a + b;
        taskText = `${a} + ${b} = ?`;
      } else if (level === 2) {
        // 2 класс: сложение/вычитание, до 20
        a = randomInt(5, 20);
        b = randomInt(1, 15);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else if (level === 3) {
        // 3 класс: сложение/вычитание, до 100
        a = randomInt(10, 100);
        b = randomInt(10, 100);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else if (level === 4) {
        // 4 класс: сложение/вычитание, до 500
        a = randomInt(100, 500);
        b = randomInt(10, 400);
        sign = Math.random() > 0.5 ? '+' : '-';
        correctAnswer = sign === '+' ? a + b : a - b;
        taskText = `${a} ${sign} ${b} = ?`;
      } else {
        // 5 класс: сложение, вычитание, умножение, деление, до 100
        const ops = ['+', '-', '×', '÷'];
        sign = ops[randomInt(0, 3)];
        if (sign === '+') {
          a = randomInt(20, 100);
          b = randomInt(10, 100);
          correctAnswer = a + b;
        } else if (sign === '-') {
          a = randomInt(20, 100);
          b = randomInt(10, a); // чтобы не было отрицательного
          correctAnswer = a - b;
        } else if (sign === '×') {
          a = randomInt(2, 15);
          b = randomInt(2, 15);
          correctAnswer = a * b;
        } else {
          b = randomInt(2, 15);
          correctAnswer = randomInt(2, 15);
          a = correctAnswer * b; // деление без остатка
        }
        taskText = `${a} ${sign} ${b} = ?`;
      }
      document.getElementById('task').textContent = taskText;
    }

    function checkAnswer() {
      const user = Number(document.getElementById('answer').value);
      if (user === correctAnswer) {
        document.getElementById('result').textContent = "Правильно! 👍";
      } else {
        document.getElementById('result').textContent = `Неправильно. Ответ: ${correctAnswer}`;
      }
      document.getElementById('reset').style.display = 'inline-block';
    }

    // Запуск при загрузке страницы
    window.onload = startGame;
  </script>
</body>
</html>
